name: Release And Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --no-install-project

      - name: Run pytest
        run: uv run pytest

  release:
    name: Create release tag
    runs-on: ubuntu-latest
    needs: test
    outputs:
      release-tag: ${{ steps.release-tag.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm install

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release

      - name: Read release tag
        id: release-tag
        run: |
          git fetch --tags --force
          release_tag="$(git tag --points-at "$GITHUB_SHA" | sort -V | tail -n 1)"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build image and deploy compose
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release-tag != ''

    env:
      DOCKER_IMAGE_TAG: ${{ needs.release.outputs.release-tag }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_USER: ${{ vars.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DOCKER_BUILDKIT: "1"
      NPM_HTTPS_PORT: ${{ vars.NPM_HTTPS_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production env file
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          printf '%s' "$ENV_CONTENT" > .env.production

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key-b64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          vm-host: ${{ vars.VM_HOST }}
          vm-user: ${{ vars.VM_USER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: ansible-playbook ansible/playbooks/build-and-push.yml

      - name: Deploy compose
        env:
          ENV_FILE_PATH: ${{ github.workspace }}/.env.production
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: ansible-playbook ansible/playbooks/deploy-compose.yml
